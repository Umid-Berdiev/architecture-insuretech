apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  namespace: insuretech
  labels:
    app: scaletestapp
spec:
  # Start with a single replica; HPA scales it up under load.
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          # Course image ghcr.io/yandex-practicum/scaletestapp:latest is amd64-only and crashes under
          # emulation on Apple Silicon, so the same source is built for arm64 and preloaded with
          # `minikube image load scaletestapp:local` (see README). On an amd64 host use the ghcr.io image.
          image: scaletestapp:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            # HPA memory utilization is computed against the request,
            # so 80 % of 20Mi = 16Mi triggers scale-out well before the 30Mi limit (OOMKill).
            requests:
              cpu: 50m
              memory: 20Mi
            limits:
              memory: 30Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
