apiVersion: v1
kind: Service
metadata:
  name: scaletestapp
  namespace: insuretech
  labels:
    app: scaletestapp
spec:
  # NodePort so that `minikube service scaletestapp -n insuretech --url` can expose it for Locust.
  type: NodePort
  selector:
    app: scaletestapp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
